<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Checkout</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
}

.container {
    width: 400px;
    margin: auto;
    margin-top: 40px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}

h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 10px;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}

button {
    margin-top: 15px;
    padding: 10px;
    width: 48%;
}

#total {
    margin-top: 15px;
    font-weight: bold;
    color: green;
}
</style>
</head>

<body>

<div class="container">
    <h2>Checkout</h2>

    <form id="checkoutForm">

        <!-- Products -->
        <label>Select Products:</label>
        <input type="checkbox" value="500" class="product"> Headphones (₹500)<br>
        <input type="checkbox" value="1000" class="product"> Keyboard (₹1000)<br>
        <input type="checkbox" value="1500" class="product"> Mouse (₹1500)<br>
        <input type="checkbox" value="2000" class="product"> Monitor (₹2000)<br>

        <!-- Total -->
        <div id="total">Total: ₹0</div>

        <!-- Payment -->
        <h3>Payment Details</h3>

        <label>Card Number:</label>
        <input type="text" id="cardNumber" maxlength="16" placeholder="1234 5678 9012 3456">

        <label>Expiry Date:</label>
        <input type="month" id="expiry">

        <label>CVV:</label>
        <input type="password" id="cvv" maxlength="3">

        <!-- Buttons -->
        <button type="submit">Pay</button>
        <button type="reset">Reset</button>

    </form>
</div>

<script>
const products = document.querySelectorAll(".product");
const totalDisplay = document.getElementById("total");
const form = document.getElementById("checkoutForm");

// Calculate total price
function calculateTotal() {
    let total = 0;
    products.forEach(p => {
        if (p.checked) {
            total += parseInt(p.value);
        }
    });
    totalDisplay.innerText = "Total: ₹" + total;
}

// Event listener for products
products.forEach(p => {
    p.addEventListener("change", calculateTotal);
});

// Form submission
form.addEventListener("submit", function(e) {
    e.preventDefault();

    let total = 0;
    products.forEach(p => {
        if (p.checked) total += parseInt(p.value);
    });

    let cardNumber = document.getElementById("cardNumber").value.trim();
    let expiry = document.getElementById("expiry").value;
    let cvv = document.getElementById("cvv").value.trim();

    // Validation
    if (total === 0) {
        alert("Select at least one product");
        return;
    }

    if (!/^\d{16}$/.test(cardNumber)) {
        alert("Enter valid 16-digit card number");
        return;
    }

    if (!expiry) {
        alert("Select expiry date");
        return;
    }

    if (!/^\d{3}$/.test(cvv)) {
        alert("Enter valid 3-digit CVV");
        return;
    }

    // AJAX simulation
    let data = {
        total: total,
        cardNumber: cardNumber,
        expiry: expiry
    };

    console.log("Sending to server:", data);

    // Simulated AJAX call
    let xhr = new XMLHttpRequest();
    xhr.open("POST", "fake-server", true);

    xhr.onload = function() {
        if (xhr.status === 200) {
            alert("Payment Successful!");
        } else {
            alert("Payment Failed!");
        }
    };

    // Simulate server response
    setTimeout(() => {
        xhr.status = 200;  // change to 500 to simulate failure
        xhr.onload();
    }, 1000);

});
</script>

</body>
</html>
