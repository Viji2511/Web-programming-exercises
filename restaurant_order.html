<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Order</title>

  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background-color: #f5f5f5;
    }

    .container {
      background: white;
      padding: 20px;
      width: 400px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input, button {
      margin-top: 10px;
      padding: 8px;
      width: 100%;
    }

    .menu-item {
      margin: 5px 0;
    }

    #addressField {
      display: none;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .success {
      color: green;
      margin-top: 10px;
    }
  </style>

</head>
<body>

<div class="container">

  <h2>Restaurant Order</h2>

  <!-- Name -->
  <label>Customer Name:</label>
  <input type="text" id="name">

  <!-- Menu -->
  <h3>Menu</h3>

  <div class="menu-item">
    <input type="checkbox" value="Burger" data-price="100"> Burger (₹100)
  </div>
  <div class="menu-item">
    <input type="checkbox" value="Pizza" data-price="200"> Pizza (₹200)
  </div>
  <div class="menu-item">
    <input type="checkbox" value="Pasta" data-price="150"> Pasta (₹150)
  </div>
  <div class="menu-item">
    <input type="checkbox" value="Drink" data-price="50"> Drink (₹50)
  </div>

  <!-- Total -->
  <h3>Total: ₹<span id="total">0</span></h3>

  <!-- Order Type -->
  <h3>Order Type</h3>
  <input type="radio" name="order_type" value="pickup" checked> Pickup
  <input type="radio" name="order_type" value="delivery"> Delivery

  <!-- Address -->
  <div id="addressField">
    <label>Address:</label>
    <input type="text" id="address">
  </div>

  <!-- Submit -->
  <button onclick="submitOrder()">Place Order</button>

  <!-- Response -->
  <div id="response"></div>

</div>

<script>

  const checkboxes = document.querySelectorAll("input[type=checkbox]");
  const totalDisplay = document.getElementById("total");

  // ✅ Live Price Update
  checkboxes.forEach(cb => {
    cb.addEventListener("change", () => {
      let total = 0;
      checkboxes.forEach(item => {
        if (item.checked) {
          total += parseInt(item.dataset.price);
        }
      });
      totalDisplay.innerText = total;
    });
  });

  // ✅ Show/Hide Address
  document.querySelectorAll("input[name=order_type]").forEach(radio => {
    radio.addEventListener("change", () => {
      if (radio.value === "delivery" && radio.checked) {
        document.getElementById("addressField").style.display = "block";
      } else {
        document.getElementById("addressField").style.display = "none";
      }
    });
  });

  // ✅ Submit + Validation
  function submitOrder() {
    const name = document.getElementById("name").value.trim();
    const address = document.getElementById("address").value.trim();
    const orderType = document.querySelector("input[name=order_type]:checked").value;

    let selectedItems = [];
    checkboxes.forEach(cb => {
      if (cb.checked) selectedItems.push(cb.value);
    });

    const responseDiv = document.getElementById("response");

    // ❌ Validations
    if (name === "") {
      responseDiv.innerHTML = "<p class='error'>Name is required</p>";
      return;
    }

    if (selectedItems.length === 0) {
      responseDiv.innerHTML = "<p class='error'>Select at least one item</p>";
      return;
    }

    if (orderType === "delivery" && address === "") {
      responseDiv.innerHTML = "<p class='error'>Address required for delivery</p>";
      return;
    }

    // ✅ Success Response (Simulated AJAX)
    responseDiv.innerHTML = `
      <p class='success'>Order placed successfully!</p>
      <p><strong>Name:</strong> ${name}</p>
      <p><strong>Items:</strong> ${selectedItems.join(", ")}</p>
      <p><strong>Order Type:</strong> ${orderType}</p>
      <p><strong>Total:</strong> ₹${totalDisplay.innerText}</p>
    `;
  }

</script>

</body>
</html>
